<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Muse Desk</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div class="brand"><span class="mark">✧</span><div><strong>Muse Desk</strong><small>Ваш домашний ассистент</small></div></div><button id="new" class="primary">＋ Новый чат</button><input id="search" type="search" placeholder="Поиск чатов" aria-label="Поиск чатов"><div class="eyebrow">ДИАЛОГИ</div><nav id="chats"></nav><button id="pair" class="connection">Подключить к Windows <span>↗</span></button><div class="status"><i id="dot"></i><div><strong id="status">Не подключено</strong><small id="address">Muse работает на вашем ПК</small></div></div></aside>
<main><header><div><h1 id="title">Новый диалог</h1><p>Muse Glimmer · на вашем компьютере</p></div><div class="actions"><button id="export" title="Экспорт диалога">Экспорт</button><button id="remove" title="Удалить этот диалог">Удалить</button></div></header><section id="messages" aria-live="polite"></section><div class="bottom"><div id="notice" role="status"></div><div class="composer"><div id="attachments"></div><textarea id="input" rows="2" placeholder="Напишите сообщение Muse…" aria-label="Сообщение Muse"></textarea><div class="toolbar"><button id="attach">＋ Файлы и фото</button><label><input id="think" type="checkbox"> Рассуждение</label><button id="speak" title="Озвучить последний ответ">◖)) Озвучить</button><button id="send" class="send" aria-label="Отправить сообщение">↑</button></div></div><p class="hint">Enter — отправить · Shift + Enter — новая строка · ⌘ N — новый чат</p></div></main><script src="renderer.js"></script></body></html>
