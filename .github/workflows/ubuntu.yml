name: Ubuntu build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install build and UI dependencies
        run: |
          audio=libasound2
          if [[ "${{ matrix.os }}" == "ubuntu-24.04" ]]; then audio=libasound2t64; fi
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 "$audio" zstd espeak-ng
      - name: Install pinned application dependencies
        working-directory: macos
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/electron/install.js
      - name: Test shared application and actual Linux runtime
        run: |
          cd macos && pnpm test && cd ..
          node scripts/test-linux-runtime.cjs
      - name: Build Ubuntu package
        working-directory: macos
        run: pnpm build:linux
      - name: Install and test packaged application
        run: |
          sudo apt-get install -y ./dist-linux/*.deb
          test "$(dpkg-deb -f dist-linux/*.deb Architecture)" = amd64
          MUSE_DESK_SMOKE_OUTPUT="$PWD/.build/ubuntu-smoke" xvfb-run -a /opt/Muse\ Desk/muse-desk --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-release-${{ matrix.os }}
          path: dist-linux/*.deb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-ui-checks-${{ matrix.os }}
          path: .build/ubuntu-smoke
