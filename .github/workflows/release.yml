name: Publish Windows, macOS and Ubuntu preview
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  privacy:
    uses: ./.github/workflows/privacy.yml
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure desktop for UI fixtures
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Test application
        shell: powershell
        run: ./scripts/test-windows.ps1
      - name: Build and test installer
        shell: powershell
        run: |
          ./scripts/build-installer.ps1 -OutputDirectory ./dist
          ./scripts/test-installer.ps1
          Copy-Item ./dist/MuseDesk-Setup.exe ./dist/MuseDesk-Windows-x64-Setup.exe
          Compress-Archive -Path ./release/* -DestinationPath ./dist/MuseDesk-Windows-x64-App.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/MuseDesk-Windows-x64-Setup.exe
            dist/MuseDesk-Windows-x64-App.zip
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install pinned dependencies
        working-directory: macos
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/electron/install.js
      - name: Test model policy and UI
        working-directory: macos
        run: |
          pnpm test
          pnpm test:ui
      - name: Test actual Apple Silicon engine without models
        run: node scripts/test-mac-runtime.cjs
      - name: Build macOS packages
        working-directory: macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm build
      - name: Verify ARM64 package
        run: |
          test "$(lipo -archs 'dist-macos/mac-arm64/Muse Desk.app/Contents/MacOS/Muse Desk')" = arm64
          codesign --verify --deep --strict 'dist-macos/mac-arm64/Muse Desk.app'
          'dist-macos/mac-arm64/Muse Desk.app/Contents/MacOS/Muse Desk' --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist-macos/*.dmg
            dist-macos/*.zip
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install build and UI dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64 zstd espeak-ng
      - name: Install pinned application dependencies
        working-directory: macos
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/electron/install.js
      - name: Test shared application and actual Linux runtime
        run: |
          cd macos && pnpm test && cd ..
          node scripts/test-linux-runtime.cjs
      - name: Build Ubuntu package
        working-directory: macos
        run: pnpm build:linux
      - name: Install and test packaged application
        run: |
          sudo apt-get install -y ./dist-linux/*.deb
          test "$(dpkg-deb -f dist-linux/*.deb Architecture)" = amd64
          MUSE_DESK_SMOKE_OUTPUT="$PWD/.build/ubuntu-smoke" xvfb-run -a /opt/Muse\ Desk/muse-desk --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-release
          path: dist-linux/*.deb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-ui-checks
          path: .build/ubuntu-smoke
  publish:
    needs: [windows, macos, ubuntu, privacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-release
          path: packages
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          sha256sum *.exe *.zip *.dmg *.deb > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --latest --title "Muse Desk $GITHUB_REF_NAME · Windows + macOS + Ubuntu (Preview)" --notes-file ../docs/RELEASE-NOTES.md
