name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure desktop for UI fixtures
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build native executable
        shell: powershell
        run: ./scripts/build-windows.ps1
      - name: Run isolated tests (no model or personal history)
        shell: powershell
        run: ./scripts/test-windows.ps1
      - name: Build standalone setup
        shell: powershell
        run: ./scripts/build-installer.ps1 -OutputDirectory ./dist
      - name: Test installer without model downloads
        shell: powershell
        run: ./scripts/test-installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MuseDesk-Setup-Windows-x64
          path: dist/
      - name: Upload Windows executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MuseDesk-Windows-x64
          path: release/
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MuseDesk-test-report
          path: test-output/**/results.txt
